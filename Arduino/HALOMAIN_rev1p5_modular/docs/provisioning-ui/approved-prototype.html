#halo-scroll-setup [hidden]{display:none!important}
#halo-scroll-setup .hs-layout{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#halo-scroll-setup .hs-halo-column{width:384px;max-width:100%;min-width:0}
#halo-scroll-setup .hs-layout.hs-paired .hs-halo-column{width:360px}
#halo-scroll-setup .hs-surface-label{text-align:center;margin-bottom:12px;letter-spacing:1px}
#halo-scroll-setup .hs-device{width:100%;aspect-ratio:1;background:#25342F;border-radius:50%;padding:9px;box-sizing:border-box;box-shadow:0 8px 20px #16332920,inset 0 0 0 1px #606F63;touch-action:pan-x;--hs-cream:#F5E9D8;--hs-green:#1F4D2B;--hs-teal:#296065;--hs-gold:#FFD54F;--hs-dark:#1A1A1A}
#halo-scroll-setup .hs-device.hs-locked{touch-action:auto}
#halo-scroll-setup .hs-glass{border-radius:50%;width:100%;height:100%;position:relative;overflow:hidden;background:#F5E9D8}
#halo-scroll-setup .hs-screen{position:absolute;width:360px;height:360px;left:0;top:0;transform-origin:0 0;font:900 16px/1.15 HSNunito,Arial,sans-serif;color:#1A1A1A}
#halo-scroll-setup .hs-frame{position:absolute;inset:0;background:#F5E9D8}
#halo-scroll-setup .hs-frame.hs-forward{animation:hs-slide-up 250ms cubic-bezier(.22,.7,.23,1)}
#halo-scroll-setup .hs-frame.hs-backward{animation:hs-slide-down 250ms cubic-bezier(.22,.7,.23,1)}
#halo-scroll-setup .hs-text{position:absolute;box-sizing:border-box;text-align:center;margin:0}
#halo-scroll-setup .hs-eyebrow{font:900 12px/1.2 HSNunito,Arial,sans-serif;letter-spacing:1.4px;color:#296065}
#halo-scroll-setup .hs-app-pill{position:absolute;top:64px;width:142px;height:30px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#FFD54F;color:#1A1A1A;border:2px solid #1A1A1A;border-radius:30px;box-shadow:2px 2px 0 #1a1a1ad9;font:900 16px/1 HSNunito,Arial,sans-serif}
#halo-scroll-setup .hs-title{font:900 25px/1.12 HSNunito,Arial,sans-serif;letter-spacing:-.45px;color:#1A1A1A}
#halo-scroll-setup .hs-copy{font:500 13px/1.4 HSMontserrat,Arial,sans-serif;color:#514E45}
#halo-scroll-setup .hs-icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
#halo-scroll-setup .hs-icon svg{width:100%!important;height:100%!important}
#halo-scroll-setup .hs-qr-card{position:absolute;width:172px;height:172px;border:2px solid #1A1A1A;border-radius:18px;background:white;box-shadow:3px 3px 0 #1a1a1ad9;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#halo-scroll-setup .hs-real-qr{width:148px;height:148px;display:block;image-rendering:pixelated}
#halo-scroll-setup .hs-example-qr{display:grid;grid-template-columns:repeat(29,1fr);width:140px;height:140px;background:white}
#halo-scroll-setup .hs-example-qr i{display:block;min-width:0;background:#1a1a1a}
#halo-scroll-setup .hs-route-row{position:absolute;left:66px;width:228px;height:54px;box-sizing:border-box;background:#fff;border:2px solid #1A1A1A;border-radius:16px;box-shadow:3px 3px 0 #1a1a1ad9;display:flex;align-items:center;justify-content:center;gap:13px;font:900 23px/1 HSNunito,Arial,sans-serif}
#halo-scroll-setup .hs-route-name{font-size:18px;line-height:1.1;text-align:left}
#halo-scroll-setup .hs-rim{position:absolute;inset:0;pointer-events:none;color:#296065}
#halo-scroll-setup .hs-rim-arc{position:absolute;left:14px;top:14px;width:332px;height:332px;box-sizing:border-box;border:2px solid transparent;border-right-color:#296065;border-radius:50%}
#halo-scroll-setup .hs-rim-letter{position:absolute;width:15px;height:18px;text-align:center;font:900 13px/18px HSNunito,Arial,sans-serif;white-space:pre;transform-origin:50% 50%}
#halo-scroll-setup .hs-rim-arrow{position:absolute;left:287px;top:286px;transform:rotate(45deg)}
#halo-scroll-setup .hs-waiting-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#296065;margin-right:7px;vertical-align:middle;animation:hs-dot 2s ease-in-out infinite}
#halo-scroll-setup .hs-phone-seal{position:absolute;left:125px;top:112px;width:110px;height:110px;border:2px solid #1a1a1a;box-sizing:border-box;border-radius:50%;background:#fff;box-shadow:3px 3px 0 #1a1a1ad9;display:flex;align-items:center;justify-content:center;color:#296065}
#halo-scroll-setup .hs-phone-seal .hs-phone-wifi{position:absolute;top:41px;left:42px;background:#fff;display:flex}
#halo-scroll-setup .hs-orbit-zone{position:absolute;left:110px;top:69px;width:140px;height:140px}
#halo-scroll-setup .hs-orbit-inner{position:absolute;inset:13px;border:4px solid transparent;border-top-color:#296065;border-radius:50%;animation:hs-orbit 4s linear infinite reverse}

<script>
(()=>{

function drawDeviceMics(){root.querySelectorAll('.hs-symbol-mic').forEach(canvas=>{
 const ctx=canvas.getContext('2d'),n=54,unit=v=>Math.floor(v*n/24);

});}
function home(target='',interactive=false){return [[134,24,'#296065','dish'],[24,134,'#1F4D2B','checkin'],[134,134,'#A66A00','voice'],[244,134,'#E53935','discard'],[134,244,'#A66A00','more']].map(([x,y,col,id])=>{const isButton=interactive&&id==='more'&&target==='more',tag=isButton?'button':'div';return `<${tag} ${isButton?'type="button" data-tour-more aria-label="Show shopping list in More menu"':''} class="hs-home-tile ${target?(target===id?'hs-target':'hs-dim'):''}" style="left:${x}px;top:${y}px;--tile-ink:${col}">${deviceSymbol(id)}</${tag}>`;}).join('');}
function more(){return label('More',42,240,'hs-title',180,'font-size:28px')+`<div class="hs-tutorial-more">${icon('list',22)}<strong>Shopping list</strong></div><div class="hs-tutorial-settings">${icon('settings',22)}<strong>Settings</strong></div>`+label(icon('chevron-left',24),300,50);}
function haloArt(){
 if(state.step===1)return eyebrow(1)+label('<span style="font-family:HSMontserrat,Arial,sans-serif;font-weight:500">Get the</span> <strong style="font-weight:900">Trepo app</strong>',65,276,'hs-title')+`<div class="hs-qr-card" style="left:94px;top:116px"><img class="hs-real-qr" src="${realQR}" alt="QR code for https://hellotrepo.com/app-signup"></div>`+rim();
 if(state.step===2)return eyebrow(2)+appPill()+`<div class="hs-route-row" style="top:119px">${icon('user-round',25)}<strong>Profile</strong></div>`+label(icon('arrow-down',22),181,40,'hs-copy')+`<div class="hs-route-row" style="top:214px">${icon('wifi',25)}<strong class="hs-route-name">Setup kitchen<br>assistant</strong></div>`+rim();
 if(state.step===3)return eyebrow(3)+label('Scan to connect',65,292,'hs-title')+`<div class="hs-qr-card" style="left:94px;top:108px">${exampleQR()}</div>`;
 if(state.step===4)return eyebrow(4)+appPill()+`<div class="hs-phone-seal">${icon('smartphone',72)}<span class="hs-phone-wifi">${icon('wifi',24)}</span></div>`+label('Select home Wi-Fi',254,306,'hs-title',180,'font-size:26px');
 if(state.step===5)return eyebrow(5)+orbit(state.phase==='account')+label('Connecting to<br>home Wi-Fi...',228,280,'hs-title',180,'font-size:27px')+label(state.phase==='account'?'Finishing account setup…':'Keep Trepo open.',294,276,'hs-copy',180,'font-size:12px')+`<div class="hs-progress-marks"><span class="${state.phase==='wifi'?'active':''}"></span><span class="${state.phase==='account'?'active':''}"></span></div>`;
 if(state.step===6){let sparks='';if(look.celebration)for(let i=0;i<12;i++){const a=i*Math.PI/6;sparks+=`<span class="hs-spark" aria-hidden="true" style="--dx:${Math.round(Math.cos(a)*92)}px;--dy:${Math.round(Math.sin(a)*82)}px;--rotation:${i*41}deg"></span>`;}return label('SETUP COMPLETE',40,240,'hs-eyebrow')+sparks+`<div class="hs-welcome-seal">${icon('check',48)}</div>`+label('Welcome to<br>your assistant',210,300,'hs-title',180,'font-size:31px');}
 return home();
}
const tours=[
 {title:'Check in groceries',target:'checkin',copy:'Tap + to add food to your kitchen.'},
 {title:'Log a dish',target:'dish',copy:'Tap the plate to capture a meal.'},
 {title:'Discard an item',target:'discard',copy:'Tap − when you remove food.'},
 {title:'Your shopping list',target:'more',copy:'Tap ••• to open More.'}
];
function appButton(text,action,extra=''){return `<button type="button" class="hs-app-button ${extra}" ${extra==='hs-app-back'?'aria-label="Previous tutorial step"':''} data-app-action="${action}">${text}</button>`;}
function appArt(){
 if(state.step===4)return '<div class="hs-app-body"><div class="hs-app-top">ASSISTANT SETUP</div><h3 class="hs-app-title">Connect your<br>kitchen assistant.</h3><p class="hs-app-copy">Choose your home Wi-Fi network.</p>'+['Home Wi-Fi','Guest network'].map(n=>`<button type="button" class="hs-network" data-network="${n}" aria-pressed="${state.network===n}">${icon('wifi',21)}<span>${n}</span><span style="margin-left:auto">${icon(state.network===n?'circle-check':'lock-keyhole',17)}</span></button>`).join('')+'<label class="hs-password-label">Wi-Fi password<input type="password" aria-label="Example Wi-Fi password" value="example123" autocomplete="off"></label>'+appButton('Connect '+icon('arrow-right',18),'connect')+'</div>';
 if(state.step===5)return '<div class="hs-app-body"><div class="hs-app-top">ASSISTANT SETUP</div><h3 class="hs-app-title">Getting connected.</h3><div class="hs-app-progress">'+orbit(state.phase==='account')+'</div><p class="hs-app-copy" style="text-align:center">'+(state.phase==='account'?'Wi-Fi connected.<br>Linking your assistant to your account…':'Connecting to<br><strong>'+state.network+'</strong>…')+'</p></div>';
 if(state.step===6)return '<div class="hs-app-body"><div class="hs-app-top">ASSISTANT SETUP</div><div class="hs-app-check">'+icon('circle-check',64)+'</div><h3 class="hs-app-title" style="text-align:center">Your kitchen<br>assistant is ready.</h3><p class="hs-app-copy" style="text-align:center">Let’s show you around.</p></div>';
 const t=tours[state.tutorial],shopping=state.tutorial===3&&state.shoppingMore;
 return `<div class="hs-app-body"><div class="hs-app-top"><span>QUICK TOUR · ${state.tutorial+1} / 4</span><button type="button" data-app-action="skip">Skip</button></div><h3 class="hs-app-title hs-tutorial-title">${t.title}</h3><div class="hs-mini-wrap"><div class="hs-mini-screen">${shopping?more():home(t.target,true)}</div></div><p class="hs-app-copy hs-tutorial-copy">${shopping?'Then tap <strong>Shopping list</strong>.':t.copy}</p><div class="hs-tour-dots" aria-hidden="true">${tours.map((_,i)=>`<span class="${i===state.tutorial?'active':''}"></span>`).join('')}</div><div class="hs-app-footer">${state.tutorial>0||state.shoppingMore?appButton(icon('chevron-left',20),'previous','hs-app-back'):''}${appButton(state.tutorial===3?(shopping?'Got it '+icon('check',18):'Show shopping list '+icon('arrow-right',18)):'Next '+icon('arrow-right',18),'next')}</div></div>`;
}
function fit(){screen.style.transform=`scale(${root.querySelector('.hs-glass').clientWidth/360})`;const mini=root.querySelector('.hs-mini-screen');if(mini)mini.style.transform=`scale(${root.querySelector('.hs-mini-wrap').clientWidth/360})`;}
function note(){if(state.step<=2)return state.armed?'App connection is still armed—even while you scroll back. Try “Simulate app connection.”':'Scroll on the display, swipe up/down, or use the turn buttons.';if(state.step===3)return 'Scrolling stops here. Provisioning QR is a placeholder; simulate Trepo connecting to continue.';if(state.step===4)return 'App detected: setup scrolling is locked. Select a demo network and connect in Trepo.';if(state.step===5)return 'Simulated Wi-Fi connection, then account linking.';if(state.step===6)return 'Setup is complete. Your kitchen assistant returns Home automatically; the app opens the quick tour.';return state.finished?'Your kitchen assistant is ready. App tutorial complete.':'Your kitchen assistant stays on its normal menu while Trepo walks through the four shortcuts.';}
function render(direction=''){
 root.dataset.step=String(state.step);root.dataset.appConnected=String(state.connected);root.dataset.pairingArmed=String(state.armed);root.dataset.tutorial=String(state.tutorial);root.dataset.shoppingMore=String(state.shoppingMore);
 screen.innerHTML=`<div class="hs-frame ${direction==='forward'?'hs-forward':direction==='backward'?'hs-backward':''} ${state.step===6?'hs-welcome '+(look.welcome==='Cream'?'hs-cream-welcome':''):''}">${haloArt()}</div>`;
 screen.setAttribute('aria-label',state.step<=6?`Kitchen assistant setup step ${state.step} of 6`:'Kitchen assistant main menu');
 const phoneVisible=state.step>=4&&!state.finished;
 el('hs-phone-column').hidden=!phoneVisible;el('hs-layout').classList.toggle('hs-paired',phoneVisible);phone.innerHTML=phoneVisible?appArt():'';
 device.classList.toggle('hs-locked',state.connected);
 el('hs-turn-controls').hidden=state.step>3;el('hs-back').disabled=state.step===1||state.connected;el('hs-forward').disabled=state.step>=3||state.connected;el('hs-step-label').textContent=`${Math.min(state.step,6)} / 6`;
 el('hs-app-connect').hidden=state.connected;el('hs-app-connect').disabled=!state.armed;
 el('hs-replay-tour').hidden=!(state.step===7&&state.finished);el('hs-note').textContent=note();
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});drawDeviceMics();fit();
}
function cancelTimers(){generation++;timers.forEach(clearTimeout);timers=[];}
function later(fn,ms){const ticket=generation;timers.push(setTimeout(()=>{if(ticket===generation)fn();},ms));}
function restart(){cancelTimers();state={step:1,armed:false,connected:false,phase:'wifi',network:'Home Wi-Fi',wifiOK:false,ownerOK:false,tutorial:0,shoppingMore:false,finished:false};lastWheel=-Infinity;pointer=null;render();}
function turn(delta){if(state.connected||state.step>3)return;const next=Math.max(1,Math.min(3,state.step+Math.sign(delta)));if(next===state.step)return;state.step=next;if(next===3)state.armed=true;render(delta>0?'forward':'backward');}
function appConnected(){if(!state.armed||state.connected||state.step>3)return;state.connected=true;state.step=4;render();}
function connect(){if(state.step!==4||!state.connected)return;cancelTimers();state.step=5;state.phase='wifi';state.wifiOK=false;state.ownerOK=false;render();later(()=>{state.wifiOK=true;state.phase='account';render();},3400);later(()=>{state.ownerOK=true;if(state.wifiOK&&state.ownerOK){state.step=6;render();later(()=>{state.step=7;state.tutorial=0;state.shoppingMore=false;state.finished=false;render();},4500);}},6500);}
function nextTour(){if(state.step!==7||state.finished)return;if(state.tutorial===3){if(!state.shoppingMore)state.shoppingMore=true;else state.finished=true;}else{state.tutorial++;state.shoppingMore=false;}render();}
function previousTour(){if(state.tutorial===3&&state.shoppingMore)state.shoppingMore=false;else state.tutorial=Math.max(0,state.tutorial-1);render();}
el('hs-back').addEventListener('click',()=>turn(-1));el('hs-forward').addEventListener('click',()=>turn(1));el('hs-app-connect').addEventListener('click',appConnected);root.addEventListener('halo-app-connected',appConnected);el('hs-restart').addEventListener('click',restart);el('hs-replay-tour').addEventListener('click',()=>{state.finished=false;state.tutorial=0;state.shoppingMore=false;render();});
device.addEventListener('wheel',e=>{if(state.connected||state.step>3)return;e.preventDefault();if(Math.abs(e.deltaY)<2)return;const now=performance.now();if(now-lastWheel<330)return;lastWheel=now;turn(e.deltaY);},{passive:false});
device.addEventListener('pointerdown',e=>{if(state.connected||state.step>3)return;pointer={id:e.pointerId,y:e.clientY};device.setPointerCapture(e.pointerId);});
device.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dy=pointer.y-e.clientY;pointer=null;if(Math.abs(dy)>28)turn(dy);});device.addEventListener('pointercancel',()=>{pointer=null;});
root.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){if(state.step<=3){e.preventDefault();turn(1);}}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){if(state.step<=3){e.preventDefault();turn(-1);}}});
root.addEventListener('click',e=>{const network=e.target.closest('[data-network]'),action=e.target.closest('[data-app-action]'),more=e.target.closest('[data-tour-more]');if(network&&state.step===4){state.network=network.dataset.network;render();}else if(more&&state.step===7){state.shoppingMore=true;render();}else if(action){const a=action.dataset.appAction;if(a==='connect')connect();else if(a==='next')nextTour();else if(a==='previous')previousTour();else if(a==='skip'){state.finished=true;render();}}});
new ResizeObserver(fit).observe(el('hs-layout'));restart();
if(globalThis.Tweak){const t=new Tweak({container:device,onChange:()=>render()});t.addSelect(look,'welcome',{label:'Welcome screen',options:['Forest green','Cream']});t.addToggle(look,'celebration',{label:'Brief celebration'});}
})();
</script>
